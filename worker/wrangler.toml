# KV namespace must match the YOURLS PHP plugin (CF_KV_NAMESPACE_ID).
name = "yourls-kv-redirect"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "YOURLS_LINKS"
id = "YOUR_KV_NAMESPACE_ID"

# [vars]
# Optional: explicitly set your primary origin domain (e.g. "yourdomain.com").
# If omitted or empty, the worker auto-detects the domain from the incoming request.
# ORIGIN_DOMAIN = "yourdomain.com"
#
# Optional: customize reserved origin paths (comma-separated, bypasses KV)
# RESERVED_PATHS = "about,contact,pricing,terms,privacy,blog"
#
# Optional: customize Cloudflare bot categories to exclude from click logging (comma-separated)
# BOT_CATEGORY_DENYLIST = "Monitoring & Analytics,Security Scanner,Advertising,Security,Advertising & Marketing"
#
# Optional: customize origin click logging endpoint (defaults to /cf-queue-logger.php)
# LOGGING_ENDPOINT = "/cf-queue-logger.php"

# Same value as LOGGING_SECRET_KEY in user/config.php (do not commit real values).
# Set in production: npx wrangler secret put LOGGING_SECRET_KEY
# Local dev: copy .dev.vars.example to .dev.vars
